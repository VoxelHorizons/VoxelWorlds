name: Build VoxelWorlds

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build API-specific JARs
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Install YAML validator
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Build API-specific JARs
        run: bash .github/scripts/build-distributions.sh

      - name: Validate generated plugin descriptors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, zipfile, yaml

          expected = {
              "legacy-1.12": None,
              "1.13": "1.13", "1.14": "1.14", "1.15": "1.15",
              "1.16": "1.16", "1.17": "1.17", "1.18": "1.18",
              "1.19": "1.19", "1.20": "1.20", "1.21": "1.21",
              "1.22": "1.22", "1.23": "1.23", "1.24": "1.24",
              "1.25": "1.25", "26.1": "26.1", "26.2": "26.2",
              "26.3": "26.3",
          }

          for suffix, api in expected.items():
              jar = f"dist/VoxelWorlds-{suffix}.jar"
              with zipfile.ZipFile(jar) as zf:
                  raw = zf.read("plugin.yml").decode("utf-8")
                  parsed = yaml.safe_load(raw)

              if parsed.get("name") != "VoxelWorlds":
                  raise SystemExit(f"{jar}: invalid plugin name")
              if api is None:
                  if "api-version" in parsed:
                      raise SystemExit(f"{jar}: legacy build must omit api-version")
              elif str(parsed.get("api-version")) != api:
                  raise SystemExit(f"{jar}: expected api-version {api}, got {parsed.get('api-version')}")

              print(f"{jar}: plugin.yml valid (api-version={api or 'legacy'})")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VoxelWorlds
          path: dist/*.jar
          if-no-files-found: error

