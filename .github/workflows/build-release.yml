name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build universal JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Stage JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="$(find target -maxdepth 1 -type f -name 'VoxelWorlds-*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" dist/VoxelWorlds.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelWorlds
          path: dist/VoxelWorlds.jar
          if-no-files-found: error

      - name: Publish rolling latest prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/VoxelWorlds.jar --clobber
            gh release edit latest \
              --title "Latest Development Build" \
              --notes "Automatically built from the latest commit on main. This is the universal multi-version VoxelWorlds JAR." \
              --prerelease
          else
            gh release create latest dist/VoxelWorlds.jar \
              --title "Latest Development Build" \
              --notes "Automatically built from the latest commit on main. This is the universal multi-version VoxelWorlds JAR." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/VoxelWorlds.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
