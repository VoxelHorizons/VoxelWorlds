name: Build VoxelWorlds

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build API-specific JARs
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build API-specific JARs
        run: bash .github/scripts/build-distributions.sh

      - name: Validate generated plugin descriptors
        run: python3 .github/scripts/validate-distributions.py

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VoxelWorlds
          path: dist/*.jar
          if-no-files-found: error

