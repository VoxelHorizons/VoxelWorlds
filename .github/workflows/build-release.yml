name: Build VoxelWorlds

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build API-specific JARs
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Install YAML validator
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Build API-specific JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          PROJECT_VERSION=$(python3 -c 'import xml.etree.ElementTree as ET; p=ET.parse("pom.xml").getroot(); print(p.find("{http://maven.apache.org/POM/4.0.0}version").text)')
          build() {
            suffix="$1"
            api_line="$2"
            mvn --batch-mode --no-transfer-progress clean package -Dplugin.api.version="$api_line" -Djar.suffix="$suffix"
            cp "target/VoxelWorlds-${PROJECT_VERSION}-$suffix.jar" "dist/VoxelWorlds-$suffix.jar"
          }

          build "legacy-1.12" ""
          build "1.13" "api-version: '1.13'"
          build "1.14" "api-version: '1.14'"
          build "1.15" "api-version: '1.15'"
          build "1.16" "api-version: '1.16'"
          build "1.17" "api-version: '1.17'"
          build "1.18" "api-version: '1.18'"
          build "1.19" "api-version: '1.19'"
          build "1.20" "api-version: '1.20'"
          build "1.21" "api-version: '1.21'"
          build "1.22" "api-version: '1.22'"
          build "1.23" "api-version: '1.23'"
          build "1.24" "api-version: '1.24'"
          build "1.25" "api-version: '1.25'"
          build "26.1" "api-version: '26.1'"
          build "26.2" "api-version: '26.2'"
          build "26.3" "api-version: '26.3'"

      - name: Validate generated plugin descriptors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, zipfile, yaml

          expected = {
              "legacy-1.12": None,
              "1.13": "1.13", "1.14": "1.14", "1.15": "1.15",
              "1.16": "1.16", "1.17": "1.17", "1.18": "1.18",
              "1.19": "1.19", "1.20": "1.20", "1.21": "1.21",
              "1.22": "1.22", "1.23": "1.23", "1.24": "1.24",
              "1.25": "1.25", "26.1": "26.1", "26.2": "26.2",
              "26.3": "26.3",
          }

          for suffix, api in expected.items():
              jar = f"dist/VoxelWorlds-{suffix}.jar"
              with zipfile.ZipFile(jar) as zf:
                  raw = zf.read("plugin.yml").decode("utf-8")
                  parsed = yaml.safe_load(raw)

              if parsed.get("name") != "VoxelWorlds":
                  raise SystemExit(f"{jar}: invalid plugin name")
              if api is None:
                  if "api-version" in parsed:
                      raise SystemExit(f"{jar}: legacy build must omit api-version")
              elif str(parsed.get("api-version")) != api:
                  raise SystemExit(f"{jar}: expected api-version {api}, got {parsed.get('api-version')}")

              print(f"{jar}: plugin.yml valid (api-version={api or 'legacy'})")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VoxelWorlds
          path: dist/*.jar
          if-no-files-found: error

