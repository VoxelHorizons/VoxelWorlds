# Actions run once, the first time a player enters a configured world.
#
# Commands are dispatched by the console.
# Supported placeholders:
#   {player} - player name
#   {uuid}   - player UUID
#   {world}  - destination world name
#
# return-to-last-location:
#   After the first visit, entering this world restores the player's last
#   position from before they left instead of leaving them at the Multiverse
#   portal/world spawn destination.
#
# The completion flag is written before commands execute so a command which
# teleports the player again cannot cause the action to run twice.

first-entry:
  realms:
    enabled: true
    return-to-last-location: true
    delay-ticks: 1
    commands:
      - "rtp player_sudo {player} {world}"
