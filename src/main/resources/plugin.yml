name: VoxelWorlds
version: ${project.version}
main: com.voxelhorizons.voxelworlds.VoxelWorlds
${plugin.api.version}
authors: [VoxelHorizons]
description: World lifecycle and first-entry actions for VoxelHorizons.
softdepend: [VoxelCore, BetterRTP, Multiverse-Core, Multiverse-Portals]

commands:
  voxelworlds:
    description: VoxelWorlds administration command.
    aliases: [vw]
    permission: voxelworlds.admin

permissions:
  voxelworlds.admin:
    description: Allows administration of VoxelWorlds.
    default: op
